#
# Example profile: provisioning/migrating an LXC whose /app already holds a
# real project (e.g. a hand-deployed Docker Compose stack).
#
# Any module line may carry trailing options, exactly like the CLI:
#   <module> [--option value ...]
#
# Here scaffold is restricted to the safety-net and tooling components
# instead of the full human-facing template (README.md, AGENTS.md,
# docker-compose.yml, scripts/, ...), since an existing project already has
# its own documentation and conventions. Existing files are still always
# preserved either way (see the scaffold module docs), but naming
# components explicitly avoids dropping unrelated template files into
# someone else's project tree.
#
# .editorconfig, .vscode, and .github are included even though they're
# "human-facing" in a broad sense: in practice they're identical
# boilerplate across every repo in this org, are never hand-tailored per
# project, and are always safe to add alongside an existing project (no
# component here ever overwrites a file that's already there).
#

tun
base
docker
user
work-dir
scaffold --component .gitignore --component .claude --component .editorconfig --component .vscode --component .github --component .homelab
secrets-guard
ssh
