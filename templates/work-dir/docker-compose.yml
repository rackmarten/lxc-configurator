name: ${WORK_DIR_PROJECT_NAME:-app}

services:
  app:
    image: ${DOCKER_IMAGE:-nginx:alpine}
    container_name: ${WORK_DIR_PROJECT_NAME:-app}
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:80"

    environment:
      TZ: ${TIMEZONE:-UTC}

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
